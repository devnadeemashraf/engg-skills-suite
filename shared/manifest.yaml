# Which shared files each skill receives. tools/sync_shared.py copies them into skills/<skill>/<path>
# so every skill stays self-contained and installable on its own.
#
# Edit files here in shared/, never the copies inside skills/, then run:
#   python tools/sync_shared.py
# CI runs `python tools/sync_shared.py --check` and fails if any copy differs or is stale.
groups:
  constitution:
    files:
      - references/engineering-constitution.md
    skills: [engg-architect, engg-audit, engg-build, engg-deep-audit, engg-extend, engg-plan, engg-refactor, engg-roadmap]

  toolchain:
    files:
      - references/toolchain.md
      - references/tool-consent.md
      - scripts/toolcheck.sh
      - scripts/toolcheck.ps1
    skills:
      - engg-architect
      - engg-audit
      - engg-build
      - engg-data
      - engg-deep-audit
      - engg-debug
      - engg-extend
      - engg-refactor
      - engg-research
      - engg-roadmap
      - engg-ship

  architecture-contract:
    files:
      - references/architecture-contract.md
      - scripts/compile_contract.py
    skills: [engg-architect, engg-audit, engg-deep-audit, engg-extend, engg-refactor]

  ratchet:
    files:
      - scripts/ratchet.py
    skills: [engg-audit, engg-deep-audit, engg-refactor]
