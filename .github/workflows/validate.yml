name: Validate Engineering Skills Suite

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all skills against open spec & suite rules
        run: python3 validate_suite.py

      - name: Syntax-check installer script
        run: bash -n install.sh
