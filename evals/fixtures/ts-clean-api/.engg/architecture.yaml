# Eval fixture: the same orders/users API as ts-messy-api, written cleanly.
# It follows its contract; an audit should raise no P0 or P1 findings.
version: 1
name: clean-api
style: hexagonal
layers:
  - name: domain
    paths: ["src/*/domain/**"]
    may_import: []
    external: none
  - name: application
    paths: ["src/*/app/**", "src/orders/index.ts"]
    may_import: [domain, shared]
  - name: adapters
    paths: ["src/*/adapters/**"]
    may_import: [domain, application, shared]
  - name: transport
    paths: ["src/*/http/**"]
    may_import: [application, domain, shared]
  - name: shared
    paths: ["src/shared/**"]
    may_import: []
  - name: composition
    paths: ["src/main.ts", "src/config.ts"]
    may_import: ["*"]
modules:
  paths: "src/*"
  public_entry: [index.ts]
rules:
  no_cycles: true
limits:
  max_file_lines: 300
  max_function_complexity: 10
targets:
  typescript: {}
